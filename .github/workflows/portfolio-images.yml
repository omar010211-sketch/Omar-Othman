name: Update portfolio image index
on:
  push:
    branches: ["**"]
    paths:
      - 'assets/client-logos/**'
      - 'assets/campaign-dashboards/**'
      - 'assets/ai-campaign-videos/**'
      - 'scripts/build-portfolio-images.py'
      - '.github/workflows/portfolio-images.yml'
permissions:
  contents: write
jobs:
  build-image-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate image index
        run: python scripts/build-portfolio-images.py
      - name: Commit updated image index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/portfolio-images.json
          git diff --cached --quiet || git commit -m "Update portfolio image index"
          git push


