<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR OTHMAN | Live Campaigns & Daily Posts</title><link rel="stylesheet" href="resource.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">OMAR <b>OTHMAN</b></a><div style="display:flex;align-items:center;gap:8px"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="theme-icon">☾</span></button><a class="back" href="index.html">← Back to Portfolio</a></div></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">Fresh work</div><h1>Live Campaigns & Daily Posts</h1><p>A dedicated space for current campaign snapshots and daily social posts. Only real material added to the content file is displayed here.</p></div></section><section><div class="wrap"><div class="grid" id="campaigns"></div></div></section></main><script>
fetch('content/live-campaigns.json').then(r=>r.json()).then(d=>{const el=document.querySelector('#campaigns');const items=[...(d.campaigns||[]).map(x=>({...x,type:'Live Campaign'})),...(d.daily_posts||[]).map(x=>({...x,type:'Daily Post'}))];if(!items.length){el.innerHTML='<div class="empty"><b>No live material added yet.</b>Add your real campaign screenshots and daily posts to the matching assets folders, then add their entries to content/live-campaigns.json.</div>';return}el.innerHTML=items.map(x=>`<article class="card"><img src="${x.image}" alt="${x.title||''}" class="zoom"><div class="body"><span class="tag">${x.platform||x.type||''}</span><h3>${x.title||''}</h3><p>${x.note||''}</p><small>${x.date||''}</small></div></article>`).join('');bind()}).catch(()=>document.querySelector('#campaigns').innerHTML='<div class="empty"><b>Content file not available.</b>Please keep content/live-campaigns.json in the repository.</div>');
function bind(){document.querySelectorAll('.zoom').forEach(i=>i.onclick=()=>{document.querySelector('#modalImg').src=i.src;document.querySelector('#modal').classList.add('open')})} </script><div class="modal" id="modal"><div class="panel"><button class="close" onclick="document.querySelector('#modal').classList.remove('open')">×</button><img id="modalImg"></div></div><script>(function(){const root=document.documentElement,btn=document.querySelector('#themeToggle'),icon=document.querySelector('.theme-icon');const saved=localStorage.getItem('omar-theme');const prefers=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;root.setAttribute('data-theme',saved||(prefers?'dark':'light'));function paint(){const d=root.getAttribute('data-theme')==='dark';if(icon)icon.textContent=d?'☀':'☾';if(btn){btn.title=d?'Light mode':'Dark mode';btn.setAttribute('aria-label',btn.title)}}paint();btn&&btn.addEventListener('click',()=>{const n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);localStorage.setItem('omar-theme',n);paint()})})();</script></body></html>
