<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR OTHMAN | Before & After</title><link rel="stylesheet" href="resource.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">OMAR <b>OTHMAN</b></a><div style="display:flex;align-items:center;gap:8px"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="theme-icon">☾</span></button><div class="folder-nav"><a class="back" href="index.html"><span class="back-arrow">←</span> Back to Portfolio</a></div></div></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">Transformation</div><h1>Before / After</h1><p>Show the starting point and the improved campaign outcome side by side. Add real campaign evidence only.</p></div></section><section><div class="wrap"><div class="grid" id="ba"></div></div></section></main><script>fetch('content/before-after.json').then(r=>r.json()).then(d=>{const el=document.querySelector('#ba');const items=d.items||[];if(!items.length){el.innerHTML='<div class="empty"><b>No before/after cases added yet.</b>Add paired campaign images to assets/before-after/ and register them in content/before-after.json.</div>';return}el.innerHTML=items.map(x=>`<article class="card"><div class="before-after"><div><span class="label">BEFORE</span><img class="zoom" src="${x.before}" alt="Before"></div><div><span class="label">AFTER</span><img class="zoom" src="${x.after}" alt="After"></div></div><div class="body"><h3>${x.title||''}</h3><p>${x.note||''}</p></div></article>`).join('');document.querySelectorAll('.zoom').forEach(i=>i.onclick=()=>{document.querySelector('#modalImg').src=i.src;document.querySelector('#modal').classList.add('open')})}).catch(()=>document.querySelector('#ba').innerHTML='<div class="empty"><b>Content file not available.</b>Please keep content/before-after.json in the repository.</div>');</script><div class="modal" id="modal"><div class="panel"><button class="close" onclick="document.querySelector('#modal').classList.remove('open')">×</button><img id="modalImg"></div></div><script>(function(){const root=document.documentElement,btn=document.querySelector('#themeToggle'),icon=document.querySelector('.theme-icon');const saved=localStorage.getItem('omar-theme');const prefers=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;root.setAttribute('data-theme',saved||(prefers?'dark':'light'));function paint(){const d=root.getAttribute('data-theme')==='dark';if(icon)icon.textContent=d?'☀':'☾';if(btn){btn.title=d?'Light mode':'Dark mode';btn.setAttribute('aria-label',btn.title)}}paint();btn&&btn.addEventListener('click',()=>{const n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);localStorage.setItem('omar-theme',n);paint()})})();</script></body></html>
