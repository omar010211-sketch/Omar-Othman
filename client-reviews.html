<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR OTHMAN | Verified Client Reviews</title><link rel="stylesheet" href="resource.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">OMAR <b>OTHMAN</b></a><div style="display:flex;align-items:center;gap:8px"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="theme-icon">☾</span></button><a class="back" href="index.html">← Back to Portfolio</a></div></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">Proof</div><h1>Verified Client Reviews</h1><p>This page accepts real written reviews, screenshots and video testimonials. Nothing is invented or auto-generated.</p></div></section><section><div class="wrap"><div class="grid" id="reviews"></div></div></section></main><script>fetch('content/client-reviews.json').then(r=>r.json()).then(d=>{const el=document.querySelector('#reviews');const items=d.reviews||[];if(!items.length){el.innerHTML='<div class="empty"><b>No verified reviews added yet.</b>Add real review images or MP4/WebM videos to assets/reviews/ and register them in content/client-reviews.json.</div>';return}el.innerHTML=items.map(x=>{const media=x.video?`<video src="${x.video}" controls preload="metadata"></video>`:`<img class="zoom" src="${x.image}" alt="${x.title||'Client review'}">`;return `<article class="card">${media}<div class="body"><span class="tag">Verified Review</span><h3>${x.title||''}</h3><p>${x.note||''}</p></div></article>`}).join('');document.querySelectorAll('.zoom').forEach(i=>i.onclick=()=>{document.querySelector('#modalImg').src=i.src;document.querySelector('#modal').classList.add('open')})}).catch(()=>document.querySelector('#reviews').innerHTML='<div class="empty"><b>Content file not available.</b>Please keep content/client-reviews.json in the repository.</div>');</script><div class="modal" id="modal"><div class="panel"><button class="close" onclick="document.querySelector('#modal').classList.remove('open')">×</button><img id="modalImg"></div></div><script>(function(){const root=document.documentElement,btn=document.querySelector('#themeToggle'),icon=document.querySelector('.theme-icon');const saved=localStorage.getItem('omar-theme');const prefers=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;root.setAttribute('data-theme',saved||(prefers?'dark':'light'));function paint(){const d=root.getAttribute('data-theme')==='dark';if(icon)icon.textContent=d?'☀':'☾';if(btn){btn.title=d?'Light mode':'Dark mode';btn.setAttribute('aria-label',btn.title)}}paint();btn&&btn.addEventListener('click',()=>{const n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);localStorage.setItem('omar-theme',n);paint()})})();</script></body></html>
